[package]
name = "qemu-mcp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
rmcp = { version = "0.5.0", features = ["transport-io"] }
schemars = "1.0.4"
serde = "1.0.219"
serde_json = "1.0.140"
tokio = { version = "1.47.1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "time",
] }

# The library target holds the implementation (src/lib.rs); the binary is a
# thin wrapper around `qemu_mcp_server::run()` (src/main.rs).
[lints.clippy]
unwrap_used = "deny"
