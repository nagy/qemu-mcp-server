[package]
name = "qemu-mcp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
rmcp = { version = "3.5.1", features = ["transport-io"] }
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "time",
] }

# The library target holds the implementation (src/lib.rs); the binary is a
# thin wrapper around `qemu_mcp_server::run()` (src/main.rs).
[lints.clippy]
unwrap_used = "deny"
