[package]
name = "qemu-mcp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
rmcp = { version = "0.5.0", features = ["transport-io"] }
schemars = "1.0.4"
serde = "1.0.219"
serde_json = "1.0.140"
tokio = { version = "1.47.1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "time",
] }

# The library target (src/lib.rs) is a thin shim so doctests run:
# `cargo test --doc` needs a library target and binary-only crates are
# skipped entirely. Unit tests live on the binary target, so keep them
# from running a second time under the library.
[lib]
test = false

[[bin]]
name = "qemu-mcp-server"
path = "qemu_mcp_server.rs"

[lints.clippy]
unwrap_used = "deny"
